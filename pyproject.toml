[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "instruction-drift"
version = "0.1.0"
description = "Long-context instruction drift measurement and adaptive prompt reinforcement (research framework)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "tiktoken>=0.7,<1",
    "pyarrow>=15,<22",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instruction_drift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
